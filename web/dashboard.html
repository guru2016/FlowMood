<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资金流情绪交易台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}body{margin:0}.top{background:#101828;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:20px}.top small{color:#aab5c6}.wrap{max-width:1180px;margin:24px auto;padding:0 20px}.actions{display:flex;gap:10px;margin-bottom:18px}button{border:0;border-radius:6px;padding:10px 16px;background:#e93030;color:#fff;cursor:pointer;font-weight:600}button.secondary{background:#344054}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:16px;box-shadow:0 1px 2px #00000008}.label{font-size:12px;color:#667085}.value{font-size:25px;font-weight:700;margin-top:8px}.panel{margin-top:16px}.panel h2{font-size:16px;margin:0 0 14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eef0f3}.buy{color:#d92d20;font-weight:700}.watch{color:#b54708;font-weight:700}.drop{color:#667085}.reason{color:#667085;font-size:12px;line-height:1.6}.notice{padding:10px 12px;background:#fff7ed;color:#9a3412;border-radius:6px;margin-bottom:16px;display:none}.muted{color:#98a2b3}.up{color:#d92d20}.down{color:#067647}select{border:1px solid #d0d5dd;border-radius:6px;padding:8px 12px;font-size:13px;background:#fff;color:#172033;cursor:pointer}.wide{overflow:auto}.seltime{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px;color:#475467}.newtag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:#fef3f2;color:#d92d20;font-size:10px;font-weight:700;vertical-align:1px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:16px}.wrap{margin:16px auto}.table{min-width:760px}}
</style></head><body><header class="top"><div><h1>资金流情绪交易台</h1><small>午盘/收盘研究，不自动下单</small></div><button class="secondary" onclick="load()">刷新</button></header><main class="wrap"><div class="actions"><button onclick="run('midday')">运行午盘报告</button><button onclick="run('close')">运行收盘报告</button></div><div id="notice" class="notice"></div><section class="grid"><div class="card"><div class="label">市场分</div><div id="score" class="value">--</div></div><div class="card"><div class="label">市场状态</div><div id="regime" class="value">--</div></div><div class="card"><div class="label">仓位建议</div><div id="position" class="value">--</div></div><div class="card"><div class="label">候选数量</div><div id="count" class="value">--</div></div></section><section class="panel"><h2>候选计划</h2><div class="wide"><table class="table"><thead><tr><th>股票</th><th>结论</th><th>入选时间</th><th>评分</th><th>交易阶段</th><th>下一动作</th><th>买入区间</th><th>空间</th><th>止损</th><th>理由/审计</th></tr></thead><tbody id="plans"><tr><td colspan="10" class="muted">加载中</td></tr></tbody></table></div></section><section class="panel"><h2>全市场评分排名</h2><div id="rankstat" class="reason" style="margin-bottom:10px">--</div><div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><label style="font-size:13px;color:#344054;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="ranklive" checked onchange="loadRank()">盘中实时（行情+评分重算）</label><label class="label" for="ranklimit">显示条数</label><select id="ranklimit" onchange="loadRank()"><option value="20">Top 20</option><option value="50">Top 50</option><option value="100" selected>Top 100</option></select></div><div class="wide"><table class="table"><thead><tr><th>#</th><th>股票</th><th>入选时间</th><th>评分</th><th>结论</th><th>涨跌</th><th>资金流</th><th>板块</th><th>空间</th><th>止损</th></tr></thead><tbody id="rankrows"><tr><td colspan="10" class="muted">加载中</td></tr></tbody></table></div></section><section class="panel"><h2>自动运行状态</h2><div id="auto" class="reason">--</div></section><section class="panel"><h2>报告文件</h2><div id="files" class="reason">--</div></section></main><script>
const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let r=await fetch('/api/status');let x=await r.json();let d=x.report||{};$('score').textContent=d.market_score??'--';$('regime').textContent=d.market_regime??'--';$('position').textContent=d.position??'--';let ps=d.plans||[];$('count').textContent=ps.length;$('plans').innerHTML=ps.length?ps.map(p=>`<tr><td>${esc(p.symbol)} ${esc(p.name)}</td><td class="${p.action==='条件买入'?'buy':p.action==='重点观察'?'watch':'drop'}">${esc(p.action)}</td><td>${selTime(p)}</td><td>${esc(p.score)}</td><td>${esc(p.setup_state)}</td><td>${esc(p.next_action)}</td><td>${esc(p.buy_price)}</td><td>${esc(p.space_pct)}%</td><td>${esc(p.stop_price)} (${esc(p.stop_pct)}%)</td><td class="reason">${esc((p.reasons||[]).join('；'))}<br>${esc((p.journal?.unmet_conditions||[]).join('；'))}</td></tr>`).join(''):'<tr><td colspan="10" class="muted">暂无候选</td></tr>';$('files').innerHTML=x.report_path?`最新计划：<a href="/files/${x.report_path}">${esc(x.report_path)}</a>`:'暂无报告';try{const a=x.auto||{};const rows=['midday','close'].map(s=>{const m=a[s];if(!m)return `<b>${s}</b>：尚未运行`;const t=String(m.finished_at||'').replace('T',' ');const st=m.skipped?'非交易日跳过':(m.all_ok?'<span style="color:#067647">全部成功</span>':'<span style="color:#b42318">有环节失败</span>');const bad=(m.steps||[]).filter(z=>!z.ok).map(z=>z.step).join(',');return `<b>${s}</b>：${st} · ${t} · 耗时 ${esc(m.elapsed_sec)}s${bad?' · 失败环节 '+esc(bad):''}`});$('auto').innerHTML=rows.join('<br>')}catch(e){$('auto').textContent='--'}if(x.alerts?.alerts?.length){$('notice').style.display='block';$('notice').textContent='告警：'+x.alerts.alerts.join('；')}else $('notice').style.display='none'}
function selTime(o){const s=o&&o.selected_at;if(!s)return '<span class="muted">--</span>';const full=String(s).replace('T',' ');const t=String(s).slice(11,19);const tag=o.selected_new?'<span class="newtag">新</span>':'';return `<span class="seltime" title="入选 ${esc(full)}">${esc(t)}</span>${tag}`}
function num(v,d){return v==null?'--':Number(v).toFixed(d==null?2:d)}
function pctTag(v){if(v==null)return '<span class="muted">--</span>';const c=v>0?'up':v<0?'down':'';return `<span class="${c}">${v>0?'+':''}${Number(v).toFixed(2)}%</span>`}
async function loadRank(){try{const lim=$('ranklimit').value;const lvEl=$('ranklive');const live=(lvEl&&lvEl.checked)?'1':'0';const r=await fetch(`/api/ranking?limit=${lim}&live=${live}`);const x=await r.json();if(x.error){$('rankrows').innerHTML=`<tr><td colspan="10" class="muted">${esc(x.error)}</td></tr>`;$('rankstat').textContent='--';return}const s=x.stats||{};const act=Object.entries(s.actions||{}).map(([k,v])=>`${k} ${v}`).join(' · ');const lv=x.live_merge||{};const qtime=String(x.quote_at||x.generated_at||'').slice(11,19);const warn=x.live_warning?` <span style="color:#b54708;font-weight:600">⚠ ${esc(x.live_warning)}</span>`:'';const badge=x.live?`<span style="color:#067647;font-weight:600">● 实时</span> ${esc((x.live_reason||''))} 行情 ${esc(qtime)} · 覆盖 ${lv.hit||0}/${lv.total||0} 只 · 折算 ${Math.round((lv.elapsed||1)*100)}%${warn}`:`<span style="color:#667085;font-weight:600">○ 快照</span> ${esc(String(x.snapshot_at||'').replace('T',' '))}${x.live_reason?'（'+esc(x.live_reason)+'）':''}`;$('rankstat').innerHTML=`${badge}<br>样本 ${s.count} 只 · 最高 <b>${num(s.max)}</b> · 中位 ${num(s.median)} · 标准差 ${num(s.stdev)} · ≥72 分 <b>${s.ge72}</b> 只 · ${esc(act)} · 市场分 ${num(x.market_score)}`;const rows=x.ranking||[];$('rankrows').innerHTML=rows.length?rows.map(p=>`<tr><td>${p.rank}</td><td>${esc(p.symbol)} ${esc(p.name)}</td><td>${selTime(p)}</td><td><b>${num(p.score)}</b></td><td class="${p.action==='条件买入'?'buy':p.action==='重点观察'?'watch':'drop'}">${esc(p.action)}</td><td>${pctTag(p.change_pct)}</td><td>${pctTag(p.money_flow_pct)}</td><td>${esc(p.sector)}</td><td>${num(p.space_pct,1)}%</td><td>${num(p.stop_pct)}%</td></tr>`).join(''):'<tr><td colspan="10" class="muted">暂无排名数据，先运行一次报告</td></tr>'}catch(e){$('rankrows').innerHTML='<tr><td colspan="10" class="muted">排名加载失败</td></tr>'}}
async function run(session){$('notice').style.display='block';$('notice').textContent='正在运行 '+session+' 报告…';let r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'session='+session});let x=await r.json();$('notice').textContent=x.ok?'运行完成':'运行失败：'+(x.error||x.stderr||'unknown');await load();await loadRank()}load();loadRank();setInterval(()=>{load();loadRank()},20000);
</script></body></html>
